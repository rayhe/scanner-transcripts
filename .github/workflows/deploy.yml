name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare partial deploy (recent audio only)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          cp -r samples _site/
          touch _site/.nojekyll

          # Copy only last 10 days of audio to keep under 1 GB Pages limit
          # Audio grows ~70 MB/day; 10 days ≈ 700 MB, well under limit
          for i in $(seq 0 9); do
            D=$(date -d "$i days ago" +%Y/%-m/%-d)
            SRC="audio/$D"
            if [ -d "$SRC" ]; then
              mkdir -p "_site/audio/$D"
              cp -r "$SRC"/* "_site/audio/$D/"
            fi
          done

          echo "=== Deploy artifact size ==="
          du -sh _site/
          du -sh _site/audio/ 2>/dev/null || echo "No audio dir"
          du -sh _site/data/
          find _site -type f | wc -l
          echo "files total"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub's artifact-metadata API is eventually consistent for large
      # artifacts: deploy-pages intermittently reports "Found 0 artifact(s)"
      # seconds after a successful upload. Wait until the artifact is
      # actually visible through the API before deploying.
      - name: Wait for artifact to be visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length')
            echo "artifact check $i: github-pages count=$COUNT"
            if [ "$COUNT" -ge 1 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::github-pages artifact not visible via API after 4 minutes; attempting deploy anyway"

      - uses: actions/deploy-pages@v4
        id: deployment

      # One retry absorbs a residual metadata lookup miss in deploy-pages.
      - name: Wait before deploy retry
        if: failure() && steps.deployment.outcome == 'failure'
        run: sleep 60

      - uses: actions/deploy-pages@v4
        if: failure() && steps.deployment.outcome == 'failure'
        id: deployment-retry
