name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-2.outputs.page_url || steps.deployment-final.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare partial deploy (recent audio only)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          cp -r samples _site/
          touch _site/.nojekyll

          # Copy only last 10 days of audio to keep under 1 GB Pages limit
          # Audio grows ~70 MB/day; 10 days ≈ 700 MB, well under limit
          for i in $(seq 0 9); do
            D=$(date -d "$i days ago" +%Y/%-m/%-d)
            SRC="audio/$D"
            if [ -d "$SRC" ]; then
              mkdir -p "_site/audio/$D"
              cp -r "$SRC"/* "_site/audio/$D/"
            fi
          done

          echo "=== Deploy artifact size ==="
          du -sh _site/
          du -sh _site/audio/ 2>/dev/null || echo "No audio dir"
          du -sh _site/data/
          find _site -type f | wc -l
          echo "files total"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages looks the artifact up through GitHub's internal
      # artifact-metadata service, which lags the upload by tens of seconds
      # for this repo's ~550 MB artifact. The REST artifacts list shows the
      # artifact immediately, so polling that API does NOT protect the
      # deploy step (observed 2026-11-25: REST count=1 one second after
      # upload, deploy-pages still reported "Found 0 artifact(s)"; the same
      # lookup succeeds ~60 s later). Give the metadata time to land before
      # the first attempt, then retry with backoff. Attempts 1-2 are
      # continue-on-error so a successful retry makes the run green; only
      # the final attempt decides the job result.
      - name: Let artifact metadata settle
        run: sleep 60

      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true

      - name: Wait before second deploy attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - uses: actions/deploy-pages@v4
        id: deployment-2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true

      - name: Wait before final deploy attempt
        if: steps.deployment-2.outcome == 'failure'
        run: sleep 120

      - uses: actions/deploy-pages@v4
        id: deployment-final
        if: steps.deployment-2.outcome == 'failure'
